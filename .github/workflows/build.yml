name: Build Kernel

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross-compiler toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm gcc-i686-linux-gnu binutils-i686-linux-gnu

      - name: Build kernel
        run: make kernel CC=i686-linux-gnu-gcc LD=i686-linux-gnu-ld

      - name: Upload kernel.elf
        uses: actions/upload-artifact@v4
        with:
          name: kernel.elf
          path: build/kernel.elf
